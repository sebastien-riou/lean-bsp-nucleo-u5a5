[bsp]
name = "nucleo-u5a5"
lean_bsp_contract_version = "1.5"
version = "0.1.0"
description = "ST NUCLEO-U5A5ZJ-Q board (STM32U5A5ZJ, Cortex-M33)"
maintainer = "sebastien.riou@pqshield.com"
entry_point = "bsp_cli.py"

[bsp.hardware]
flash_bytes = 0x200000               # bank 1; bank 2 is NVM region 0
ram_bytes = 0x270000

[bsp.mcu]                            # contract 1.5: what the application runs on
vendor = "ST"
part = "STM32U5A5ZJT6Q"              # the ordering code, from the STM32CubeMX project (nucleo-u5a5.ioc)
families = ["STM32", "STM32U5", "STM32U5A5"]
checked = false                      # declared only
reserved = ["RCC", "PWR", "FLASH", "ICACHE", "DCACHE1", "SysTick", "DWT", "TIM5", "USART1", "EXTI13", "PC7", "PB7", "PG2", "PC13"]

[bsp.build]
backend = "custom"                   # bsp_cli.py drives the compiler; CROSS_COMPILE selects it
requires_tools = ["arm-none-eabi-gcc", "hwbridge"]

[bsp.primitives]
uart = true                          # UART 0 is COM1, the ST-LINK virtual COM port
led = true                           # 0 green, 1 blue, 2 red
button = true                        # 0 is the blue user button
cpu_cycle_counter = true             # DWT CYCCNT
cpu_frequency = true
cache_clear = true                   # ICACHE, DCACHE1 and the flash prefetch buffer
cycle_timer = true                   # TIM5, one tick per CPU cycle
heap_usage = true                    # src/bsp_heap.c, lean-bsp's heap counter
flash_read = true                    # NVM region 0, flash bank 2
flash_erase = true
flash_write = true

[[bsp.nvm_regions]]
name = "bank2"                       # never loaded: the image stays in bank 1
base = 0x08200000
size = 0x200000
page_size = 8192
write_size = 16                      # a quad-word, the ECC word
zero_overwrite = true

[[bsp.targets]]
name = "cortex-m33"
cpu = "cortex-m33"
toolchain = "arm-none-eabi"
cflags = ["-mcpu=cortex-m33", "-mthumb", "-mfpu=fpv5-sp-d16", "-mfloat-abi=softfp"]
linker_fragments = ["memory.ld", "sections_head.ld", "sections_data.ld", "sections_tail.ld"]
run_mode = "auto-after-load"
trustzone = "off"                    # TZEN=0: the image runs from the non-secure flash alias
